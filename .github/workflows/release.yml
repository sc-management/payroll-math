name: 🚀 Release

on:
  push:
    branches:
      - main
    # 可选：只有版本号变更时才触发
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 检出代码
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2️⃣ 设置支持 OIDC 的 Node/npm 版本
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Lint
      - name: Lint
        run: npm run lint

      # 5️⃣ Test
      - name: Run tests
        run: npm test

      # 6️⃣ Build
      - name: Build package
        run: npm run build

      # 7️⃣ Publish to npm (only on main & with tag)
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public
